<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="color-scheme" content="dark light">
		<script type="importmap">
			{"imports":{"acorn":"https://esm.sh/acorn@8.15.0"}}
		</script>
		<title>pperm.js Playground</title>
		<style>
			:root {
				font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
				color: #e5e7eb;
				background: #111318;
				font-synthesis: none;
			}

			* {
				box-sizing: border-box;
			}

			body {
				max-width: 1100px;
				margin: 0 auto;
				padding: 40px 24px;
			}

			header {
				margin-bottom: 28px;
			}

			h1 {
				margin: 0 0 8px;
				font-size: clamp(28px, 5vw, 42px);
				letter-spacing: -0.05em;
			}

			header p, .hint {
				color: #9ca3af;
				line-height: 1.6;
			}

			.workspace {
				display: grid;
				grid-template-columns: minmax(0, 1.4fr) minmax(260px, 0.8fr);
				gap: 16px;
			}

			.panel {
				min-width: 0;
				overflow: hidden;
				border: 1px solid #30343d;
				border-radius: 12px;
				background: #191c23;
			}

			.panel-title {
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 13px 16px;
				border-bottom: 1px solid #30343d;
				font-size: 13px;
				color: #cbd5e1;
			}

			textarea {
				display: block;
				width: 100%;
				min-height: 360px;
				resize: vertical;
				padding: 18px;
				border: 0;
				outline: none;
				color: #e5e7eb;
				background: transparent;
				font: 14px/1.7 ui-monospace, SFMono-Regular, Consolas, monospace;
				tab-size: 2;
			}

			.toolbar {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 12px;
				padding: 14px 16px;
				border-top: 1px solid #30343d;
			}

			button {
				padding: 9px 15px;
				border: 1px solid #414653;
				border-radius: 8px;
				color: #e5e7eb;
				background: #272b35;
				font: inherit;
				cursor: pointer;
			}

			button.primary {
				border-color: #818cf8;
				color: white;
				background: #4f46e5;
			}

			button:disabled {
				opacity: 0.45;
				cursor: not-allowed;
			}

			.permissions {
				display: grid;
				gap: 14px;
				padding: 16px;
			}

			label {
				display: flex;
				align-items: center;
				gap: 9px;
				font-size: 14px;
			}

			input[type="checkbox"] {
				accent-color: #818cf8;
				width: 16px;
				height: 16px;
			}

			.hint {
				margin: 0;
				font-size: 12px;
			}

			#output {
				min-height: 180px;
				max-height: 360px;
				overflow: auto;
				margin: 0;
				padding: 16px;
				color: #cbd5e1;
				white-space: pre-wrap;
				overflow-wrap: anywhere;
				font: 13px/1.7 ui-monospace, SFMono-Regular, Consolas, monospace;
			}

			#status {
				color: #a5b4fc;
			}

			@media (max-width: 720px) {
				body {
					padding: 24px 14px;
				}

				.workspace {
					grid-template-columns: 1fr;
				}

				textarea {
					min-height: 280px;
				}
			}
		</style>
	</head>
	<body>
		<header>
			<h1>pperm.js <span style="color:#818cf8">Playground</span></h1>
			<p>在主线程中异步并发运行多个 JavaScript 实例；DOM API 同步调用，每个实例独立限时。</p>
		</header>

		<main class="workspace">
			<section class="panel">
				<div class="panel-title">
					<span>JavaScript</span>
					<span id="status">就绪</span>
				</div>
				<textarea id="editor" spellcheck="false" aria-label="JavaScript 代码编辑器">postMessage("Hello from pperm.js");
postMessage("DOM permission: " + permissions.dom.enabled);

if (!permissions.dom.enabled) {
	postMessage("请启用 DOM 权限后运行完整示例。");
	return 42;
}

document.body.textContent = "同步 DOM API 示例";

const button = document.createElement("button");
button.textContent = "点击我";
button.style.backgroundColor = "#4f46e5";
button.style.color = "white";
document.body.appendChild(button);

postMessage("按钮已创建，点击按钮以测试事件监听。");
await new Promise(resolve => {
	button.addEventListener("click", event => {
		postMessage("收到事件：" + event.type);
		resolve();
	}, { once: true });
});</textarea>
				<div class="toolbar">
					<button class="primary" id="run">启动实例 ▶</button>
					<button id="stop" disabled>停止全部</button>
					<button id="clear">清空输出</button>
				</div>
			</section>

			<div>
				<section class="panel" style="margin-bottom:16px">
					<div class="panel-title">进程权限</div>
					<div class="permissions">
						<strong>网络</strong>
						<label><input id="fetch" type="checkbox"> fetch</label>
						<label><input id="webSocket" type="checkbox"> WebSocket</label>
						<label><input id="eventSource" type="checkbox"> EventSource</label>
						<label><input id="xmlHttpRequest" type="checkbox"> XMLHttpRequest</label>
						<strong>存储</strong>
						<label><input id="indexedDB" type="checkbox"> IndexedDB</label>
						<label><input id="cache" type="checkbox"> Cache API</label>
						<strong>DOM 桥接</strong>
						<label><input id="domEnabled" type="checkbox"> 允许操作指定元素</label>
						<label for="domRoot">可操作的根元素选择器</label>
						<input id="domRoot" value="#dom-target" aria-label="DOM 根元素选择器">
						<p class="hint">DOM 操作同步执行，不需要为 DOM 写 await。每次点击“启动实例”都会创建一个独立进程；可重复启动并发运行，点击“停止全部”终止所有实例。每个实例默认限时 10000 毫秒。主线程中的长表达式或原生调用仍无法被强制抢占。</p>
					</div>
				</section>

				<section class="panel" style="margin-bottom:16px">
					<div class="panel-title">受控 DOM 目标</div>
					<div id="dom-target" style="padding:16px">
						<p id="message">这是允许 Playground 进程操作的示例元素。</p>
					</div>
				</section>

				<section class="panel">
					<div class="panel-title">
						<span>输出</span>
						<span>stdout / result / error</span>
					</div>
					<pre id="output" aria-live="polite">等待运行。</pre>
				</section>
			</div>
		</main>

		<script type="module">
			import pperm from "./pperm.js?v=20261026-1";

			const editor = document.querySelector("#editor");
			const output = document.querySelector("#output");
			const status = document.querySelector("#status");
			const runButton = document.querySelector("#run");
			const stopButton = document.querySelector("#stop");
			const processes = new Set();

			function write(value) {
				output.textContent += String(value) + "\n";
			}

			function setRunning() {
				stopButton.disabled = processes.size === 0;
				status.textContent = processes.size ? "运行中：" + processes.size + " 个实例" : "就绪";
			}

			function stopAll() {
				for (const current of processes) current.terminate();
				processes.clear();
				setRunning();
			}

			runButton.addEventListener("click", async () => {
				const current = pperm.create({
					permissions: {
						network: {
							fetch: document.querySelector("#fetch").checked,
							webSocket: document.querySelector("#webSocket").checked,
							eventSource: document.querySelector("#eventSource").checked,
							xmlHttpRequest: document.querySelector("#xmlHttpRequest").checked
						},
						storage: {
							indexedDB: document.querySelector("#indexedDB").checked,
							cache: document.querySelector("#cache").checked
						},
						dom: {
							enabled: document.querySelector("#domEnabled").checked,
							root: document.querySelector("#domRoot").value.trim() || "#dom-target"
						}
					}
				});

				processes.add(current);
				setRunning();
				write("[启动实例] 当前代码已提交执行");

				current.addEventListener("message", event => {
					if (processes.has(current)) write("[实例消息] " + event.detail);
				});

				current.addEventListener("error", event => {
					if (processes.has(current)) write("[实例错误] " + (event.detail?.stack ?? event.detail?.message ?? event.detail));
				});

				try {
					const result = await current.run(editor.value);
					if (processes.has(current)) write("[实例完成] => " + String(result));
				} catch (error) {
					if (processes.has(current)) write("[实例失败] " + (error?.stack ?? error?.message ?? error));
				} finally {
					current.terminate();
					processes.delete(current);
					setRunning();
				}
			});

			stopButton.addEventListener("click", () => {
				stopAll();
				write("[全部实例已停止]");
			});

			document.querySelector("#clear").addEventListener("click", () => {
				output.textContent = "";
			});

			editor.addEventListener("keydown", event => {
				if (event.key === "Tab") {
					event.preventDefault();
					const selectionStart = editor.selectionStart;
					const selectionEnd = editor.selectionEnd;
					editor.setRangeText("\t", selectionStart, selectionEnd, "end");
				}

				if ((event.ctrlKey || event.metaKey) && event.key === "Enter") runButton.click();
			});
		</script>
	</body>
</html>
